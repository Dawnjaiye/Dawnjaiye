<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prism Cam — Live Camera FX</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif; color:#eee; }
  #view { position:fixed; inset:0; width:100%; height:100%; object-fit:contain;
    display:block; touch-action:none; background:#000; }
  #panel { position:fixed; left:0; right:0; bottom:0; max-height:64%; overflow-y:auto;
    background:rgba(8,8,10,.94); backdrop-filter:blur(10px);
    border-top:1px solid #2a2a2e; padding:10px 14px 18px; z-index:10;
    transition:transform .25s ease; }
  #panel.hidden { transform:translateY(calc(100% - 34px)); }
  #grab { height:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #grab::before { content:""; width:44px; height:4px; border-radius:2px; background:#444; }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .row label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#999; min-width:52px; }
  select,button { background:#1b1b1f; color:#eee; border:1px solid #333; border-radius:8px;
    font-size:13px; padding:8px 10px; }
  button { cursor:pointer; }
  button:active { background:#2a2a30; }
  button.primary { background:#e8e4da; color:#111; border-color:#e8e4da; font-weight:600; }
  button.rec { background:#c22; border-color:#c22; color:#fff; font-weight:600; }
  button.rec.on { background:#f44; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  button[aria-pressed="true"] { border-color:#e8e4da; color:#fff; background:#2c2c33; }
  input[type=range] { flex:1; min-width:80px; accent-color:#e8e4da; }
  .val { font-family:monospace; font-size:12px; color:#bbb; width:46px; text-align:right; }
  .fx { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .fx button { font-size:12px; padding:6px 9px; }
  #hint { font-size:11px; color:#777; margin-top:6px; line-height:1.5; }
  .filein { position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0; }
  #camStatus { font-size:12px; color:#bbb; }
  #nudge { position:fixed; top:14px; left:0; right:0; text-align:center; z-index:20;
    pointer-events:none; font-size:13px; color:#fff; text-shadow:0 1px 6px #000;
    background:rgba(0,0,0,.45); margin:0 auto; width:max-content; max-width:92vw;
    padding:8px 16px; border-radius:20px; display:none; }
  #cambar { position:fixed; top:58px; left:0; right:0; z-index:21;
    margin:0 auto; width:max-content; max-width:92vw;
    background:rgba(10,10,12,.94); border:1px solid #3a3a40; border-radius:14px;
    padding:12px 16px; display:none; text-align:center; }
  #cambar p { margin:0 0 10px; font-size:13px; line-height:1.5; color:#ddd; max-width:70vw; }
  #cambar .row { margin:0; justify-content:center; }
  #recTime { color:#f66; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="nudge"></div>
<div id="cambar"><p id="cambarMsg"></p><div class="row"><button id="camRetry" class="primary">Enable camera</button></div></div>

<div id="panel">
  <div id="grab"></div>
  <div id="fxGroups"></div>
  <div id="sliders"></div>

  <div class="row" id="rowMirror" style="display:none">
    <label>Mirror</label>
    <div class="fx">
      <button data-m="1" class="mbtn" aria-pressed="true">Left/Right</button>
      <button data-m="2" class="mbtn" aria-pressed="false">Top/Bottom</button>
      <button data-m="3" class="mbtn" aria-pressed="false">Quad</button>
    </div>
  </div>

  <div class="row">
    <label>Motion</label>
    <input type="range" id="sMotion" min="0" max="3" step="0.05" value="1">
    <span class="val" id="vMotion">1.00</span>
  </div>

  <div class="row">
    <button id="flip">Flip camera</button>
    <button id="snap">Snapshot</button>
    <button id="rec" class="rec">Record</button>
    <span id="recTime" class="val"></span>
  </div>

  <div class="row">
    <label>Quality</label>
    <select id="qSel">
      <option value="720">720p</option>
      <option value="1080" selected>1080p</option>
    </select>
    <label>Bitrate</label>
    <select id="bSel">
      <option value="8000000">8 Mbps</option>
      <option value="16000000" selected>16 Mbps</option>
      <option value="30000000">30 Mbps</option>
    </select>
  </div>

  <div class="row">
    <label>Source</label>
    <span id="camStatus">starting…</span>
  </div>
  <div class="row">
    <button id="retryCam">Retry camera</button>
    <button id="btnPhoto">Take photo</button>
    <button id="btnClip">Record clip</button>
    <input type="file" id="capPhoto" accept="image/*" capture="environment" class="filein">
    <input type="file" id="capClip" accept="video/*" capture="environment" class="filein">
  </div>
  <details id="diag" style="font-size:11px;color:#888">
    <summary style="cursor:pointer;color:#999;font-size:11px">Diagnostics (tap if camera still fails)</summary>
    <div id="diagBody" style="margin-top:4px;line-height:1.6">—</div>
  </details>

  <div id="hint">v3 — 18 live FX. Record captures at the selected quality (16:9) for projection mapping. Snapshot saves a PNG at full canvas resolution.</div>
</div>

<script>
"use strict";
/* ================= state ================= */
const $=id=>document.getElementById(id);
const GROUPS=["Warp","Time","Color","Look"];
// [group,id,label,defaultOn,sliderDef|null]  sliderDef:[label,min,max,step,val,fmt]
const FXDEF=[
 ["Warp","kaleido","Kaleido",true,["Segments",2,16,1,8,v=>v]],
 ["Warp","mirror","Mirror",false,null],
 ["Warp","swirl","Swirl",false,["Swirl",0,10,0.1,4,v=>v.toFixed(1)]],
 ["Warp","bulge","Bulge",false,["Bulge",0,2,0.05,1,v=>v.toFixed(2)]],
 ["Warp","wave","Wave",false,["Wave",0,2,0.05,1,v=>v.toFixed(2)]],
 ["Warp","pixel","Pixel",false,["Size",8,120,1,42,v=>v]],
 ["Time","glitch","Glitch",true,["Glitch",0,0.3,0.005,0.08,v=>v.toFixed(3)]],
 ["Time","trails","Trails",false,["Echo",0,0.95,0.01,0.82,v=>v.toFixed(2)]],
 ["Time","vhs","VHS",false,["VHS",0,1,0.05,0.7,v=>v.toFixed(2)]],
 ["Color","rgb","RGB split",true,["Split",0,0.06,0.002,0.012,v=>v.toFixed(3)]],
 ["Color","hue","Hue cycle",false,["Cycle",0,2,0.05,1,v=>v.toFixed(2)]],
 ["Color","poster","Poster",false,["Levels",2,8,1,4,v=>v]],
 ["Color","duo","Duotone",false,["Duo",0,1,0.05,0.8,v=>v.toFixed(2)]],
 ["Color","invert","Invert",false,["Invert",0,1,0.05,1,v=>v.toFixed(2)]],
 ["Look","edge","Contour",false,["Lines",0,1,0.05,1,v=>v.toFixed(2)]],
 ["Look","scan","Scanlines",false,["Scan",0,1,0.05,0.5,v=>v.toFixed(2)]],
 ["Look","grain","Grain",false,["Grain",0,1,0.05,0.5,v=>v.toFixed(2)]],
 ["Look","vig","Vignette",false,["Vig",0,1,0.05,0.6,v=>v.toFixed(2)]],
];
const S={fx:{},mirrorMode:1,facing:"environment",motion:1,quality:1080,bitrate:16000000};
FXDEF.forEach(d=>{S.fx[d[1]]={on:d[3],amt:d[4]?d[4][4]:0,def:d};});

const nudgeEl=$("nudge");
function nudge(msg,ms=2600){nudgeEl.textContent=msg;nudgeEl.style.display="block";
  clearTimeout(nudgeEl._t);nudgeEl._t=setTimeout(()=>nudgeEl.style.display="none",ms);}

/* ================= WebGL ================= */
const canvas=$("view");
const gl=canvas.getContext("webgl2",{preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML="<div style='padding:40px;text-align:center'>WebGL2 is required.</div>";throw 0;}

const VS=`#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.,1.);}`;

const FS_FX=`#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes,uCover,uTexel;
uniform float uTime;
uniform float uKSeg,uMirror,uSwirl,uBulge,uWave,uPixel;
uniform float uGlitch,uVHS;
uniform float uRGB,uHue,uPoster,uDuo,uInvert;
uniform float uEdge,uScan,uGrain,uVig;
in vec2 vUv; out vec4 frag;
float hash(float n){return fract(sin(n*127.1)*43758.5453);}
float hash2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 rgb2hsv(vec3 c){
  vec4 K=vec4(0.0,-1.0/3.0,2.0/3.0,-1.0);
  vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));
  vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));
  float d=q.x-min(q.w,q.y); float e=1.0e-10;
  return vec3(abs(q.z+(q.w-q.y)/(6.0*d+e)),d/(q.x+e),q.x);
}
vec3 hsv2rgb(vec3 c){
  vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);
  vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);
  return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);
}
float lumAt(vec2 p){return dot(texture(uTex,p).rgb,vec3(0.299,0.587,0.114));}
void main(){
  float t=uTime;
  vec2 uv=(vUv-0.5)*uCover+0.5;
  if(uKSeg>0.5){
    vec2 c=uv-0.5; float r=length(c); float a=atan(c.y,c.x);
    float sl=6.2831853/uKSeg; a=mod(a,sl); a=abs(a-sl*0.5);
    uv=vec2(cos(a),sin(a))*r+0.5;
  }
  if(uMirror>0.5){
    if(uMirror<1.5) uv.x=abs(uv.x-0.5);
    else if(uMirror<2.5) uv.y=abs(uv.y-0.5);
    else {uv.x=abs(uv.x-0.5); uv.y=abs(uv.y-0.5);}
  }
  if(uSwirl>0.001){
    vec2 c=uv-0.5; float r=length(c);
    float ang=uSwirl*exp(-r*r*7.0);
    float s=sin(ang),co=cos(ang);
    uv=vec2(co*c.x-s*c.y,s*c.x+co*c.y)+0.5;
  }
  if(uBulge>0.001){
    vec2 c=uv-0.5; float r=length(c);
    uv=c*(1.0-uBulge*0.38*exp(-r*r*8.0))+0.5;
  }
  if(uWave>0.001){
    uv.x+=sin(uv.y*24.0+t*3.0)*0.022*uWave;
    uv.y+=cos(uv.x*20.0-t*2.2)*0.022*uWave;
  }
  if(uGlitch>0.001){
    float row=floor(uv.y*80.0);
    float tt=floor(t*10.0);
    float band=step(0.70,hash(row*0.37+tt*3.1));
    uv.x+=(hash(row+tt*17.0)-0.5)*uGlitch*band;
    float tear=step(0.94,hash(row*1.7+tt*7.7));
    uv.x+=tear*uGlitch*1.5*(hash(tt*3.3)-0.5);
  }
  vec2 chroma=vec2(0.0);
  if(uVHS>0.001) chroma.x=sin(uv.y*90.0+t*13.0)*0.004*uVHS;
  if(uPixel>0.5){
    vec2 grid=vec2(uPixel,uPixel*uRes.y/uRes.x);
    uv=(floor(uv*grid)+0.5)/grid;
  }
  vec3 col;
  if(uRGB>0.001||uVHS>0.001){
    vec2 roff=(uv-0.5)*uRGB+chroma;
    col=vec3(texture(uTex,uv+roff).r,texture(uTex,uv).g,texture(uTex,uv-roff).b);
  }else{
    col=texture(uTex,uv).rgb;
  }
  if(uVHS>0.001){
    float barPos=fract(t*0.11);
    float bar=smoothstep(0.045,0.0,abs(vUv.y-barPos));
    col=mix(col,vec3(0.85,0.9,0.95),bar*0.5*uVHS);
    float n=hash2(vec2(floor(vUv.x*240.0),floor(vUv.y*135.0))+floor(t*24.0)*0.37);
    col+=(n-0.5)*0.22*uVHS;
    col*=1.0-0.10*uVHS;
  }
  if(uHue>0.001){
    vec3 hsv=rgb2hsv(col);
    hsv.x=fract(hsv.x+t*0.06*uHue);
    hsv.y=clamp(hsv.y*(0.7+0.6*uHue),0.0,1.0);
    col=hsv2rgb(hsv);
  }
  if(uPoster>0.5) col=floor(col*uPoster+0.5)/uPoster;
  if(uDuo>0.001){
    float g=dot(col,vec3(0.299,0.587,0.114));
    col=mix(col,mix(vec3(0.015,0.02,0.07),vec3(1.0,0.85,0.55),g),uDuo);
  }
  if(uInvert>0.001) col=mix(col,vec3(1.0)-col,uInvert);
  if(uEdge>0.001){
    vec2 e=uTexel;
    float tl=lumAt(uv+vec2(-e.x,-e.y)), tc=lumAt(uv+vec2(0.0,-e.y)), tr=lumAt(uv+vec2(e.x,-e.y));
    float ml=lumAt(uv+vec2(-e.x,0.0)), mr=lumAt(uv+vec2(e.x,0.0));
    float bl=lumAt(uv+vec2(-e.x,e.y)), bc=lumAt(uv+vec2(0.0,e.y)), br=lumAt(uv+vec2(e.x,e.y));
    float gx=-tl-2.0*ml-bl+tr+2.0*mr+br;
    float gy=-tl-2.0*tc-tr+bl+2.0*bc+br;
    float line=smoothstep(0.12,0.5,sqrt(gx*gx+gy*gy));
    vec3 glow=vec3(0.72,0.84,1.0)*(0.5+1.1*line);
    col=mix(col,col*0.10+glow*line,uEdge);
  }
  if(uScan>0.001) col*=1.0-uScan*0.22*(0.5+0.5*sin(vUv.y*uRes.y*3.14159));
  if(uGrain>0.001) col+=(hash2(vUv*913.7+fract(t)*7.31)-0.5)*0.28*uGrain;
  if(uVig>0.001){vec2 vc=vUv-0.5; col*=1.0-uVig*1.1*dot(vc,vc);}
  frag=vec4(col,1.0);
}`;

const FS_COMP=`#version 300 es
precision highp float;
uniform sampler2D uCur,uPrev;
uniform float uTAmt,uTZoom;
in vec2 vUv; out vec4 frag;
void main(){
  vec3 cur=texture(uCur,vUv).rgb;
  vec2 puv=(vUv-0.5)*(1.0+uTZoom)+0.5;
  vec3 prv=texture(uPrev,puv).rgb;
  frag=vec4(mix(cur,prv,uTAmt),1.0);
}`;

const FS_BLIT=`#version 300 es
precision highp float;
uniform sampler2D uT;
in vec2 vUv; out vec4 frag;
void main(){frag=vec4(texture(uT,vUv).rgb,1.0);}`;

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){const l=gl.getShaderInfoLog(o);throw new Error("shader: "+l);}return o;}
function prog(fsSrc,uniforms){
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fsSrc));
  gl.bindAttribLocation(p,0,"aPos");
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error("link: "+gl.getProgramInfoLog(p));
  const U={};uniforms.forEach(n=>U[n]=gl.getUniformLocation(p,n));
  return {p,U};
}
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const aPosLoc=0;
function useQuad(p){
  gl.useProgram(p.p);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.enableVertexAttribArray(aPosLoc);
  gl.vertexAttribPointer(aPosLoc,2,gl.FLOAT,false,0,0);
  gl.vertexAttribDivisor(aPosLoc,0);
}
const fxP=prog(FS_FX,["uTex","uRes","uCover","uTexel","uTime",
  "uKSeg","uMirror","uSwirl","uBulge","uWave","uPixel",
  "uGlitch","uVHS","uRGB","uHue","uPoster","uDuo","uInvert",
  "uEdge","uScan","uGrain","uVig"]);
const compP=prog(FS_COMP,["uCur","uPrev","uTAmt","uTZoom"]);
const blitP=prog(FS_BLIT,["uT"]);

const camTex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,camTex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

function makeFBO(w,h){
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {fb,tex};
}
let fxFBO=null,ping=null,pong=null,usePing=true;
const blackTex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,blackTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,2,2,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(16));
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
let prevTex=blackTex;
function clearTrails(){
  [ping,pong].forEach(o=>{if(!o)return;
    gl.bindFramebuffer(gl.FRAMEBUFFER,o.fb);
    gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);});
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  prevTex=blackTex;
}
function buildFBOs(){
  [fxFBO,ping,pong].forEach(o=>{if(o){gl.deleteFramebuffer(o.fb);gl.deleteTexture(o.tex);}});
  const w=canvas.width,h=canvas.height;
  fxFBO=makeFBO(w,h); ping=makeFBO(w,h); pong=makeFBO(w,h);
  clearTrails();
}
function bindTex(unit,tex){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);}

/* ================= camera / fallback source ================= */
const video=document.createElement("video");
video.playsInline=true; video.muted=true; video.loop=true;
let camW=1280, camH=720;
let mode="pattern";
let camGen=0, lastErr=null;

const pat=document.createElement("canvas"); pat.width=512; pat.height=288;
const pctx=pat.getContext("2d");
function drawPattern(t){
  const w=pat.width,h=pat.height;
  const g=pctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,"#0b3b8f"); g.addColorStop(.5,"#7a1e5e"); g.addColorStop(1,"#0e7a5c");
  pctx.fillStyle=g; pctx.fillRect(0,0,w,h);
  for(let i=0;i<7;i++){
    const x=w*(0.5+0.42*Math.sin(t*0.0004*(i+1)+i*2.1));
    const y=h*(0.5+0.42*Math.cos(t*0.0005*(i+2)+i*1.3));
    const r=26+22*Math.sin(t*0.001+i);
    const rg=pctx.createRadialGradient(x,y,2,x,y,Math.abs(r)+4);
    const hue=(t*0.02+i*52)%360;
    rg.addColorStop(0,`hsla(${hue},90%,65%,.95)`); rg.addColorStop(1,"hsla(0,0%,0%,0)");
    pctx.fillStyle=rg; pctx.beginPath(); pctx.arc(x,y,Math.abs(r)+4,0,7); pctx.fill();
  }
  pctx.fillStyle="rgba(255,255,255,.9)"; pctx.font="bold 22px sans-serif";
  pctx.fillText("PRISM CAM — test pattern",18,34);
}

const cambar=$("cambar"), cambarMsg=$("cambarMsg");
function showCambar(msg){cambarMsg.textContent=msg;cambar.style.display="block";}
function hideCambar(){cambar.style.display="none";}
function setStatus(s){const el=$("camStatus");if(el)el.textContent="Source: "+s;}
async function refreshDiag(){
  const el=$("diagBody"); if(!el)return;
  const lines=[];
  lines.push("secure context: "+window.isSecureContext);
  const hasMD=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  lines.push("camera API present: "+hasMD);
  if(hasMD){
    try{
      const devs=await navigator.mediaDevices.enumerateDevices();
      lines.push("video inputs seen: "+devs.filter(d=>d.kind==="videoinput").length);
    }catch(e){lines.push("enumerateDevices: "+(e.name||e.message||e));}
  }
  lines.push("last error: "+(lastErr?(lastErr.name+": "+(lastErr.message||"(no message)")):"none"));
  lines.push("mode: "+mode);
  el.innerHTML=lines.map(l=>String(l).replace(/</g,"&lt;")).join("<br>");
}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);}
function describeErr(e){
  if(!e)return "unknown";
  if(e.message==="timeout")return "the permission popup never answered";
  const n=e.name||"";
  if(n==="NotAllowedError")return "permission denied";
  if(n==="NotFoundError"||n==="OverconstrainedError")return "no matching camera";
  if(n==="SecurityError")return "blocked by this viewer";
  return n||"error";
}
function stopLive(){
  if(video.srcObject){try{video.srcObject.getTracks().forEach(t=>t.stop());}catch(e){}video.srcObject=null;}
  try{video.pause();}catch(e){}
}
async function initCamera(){
  const gen=++camGen;
  stopLive();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    mode="pattern"; setStatus("unavailable (no camera API in this viewer)");
    showCambar("This viewer can't reach your camera at all. Use Take photo or Record clip below — they open your phone's own camera app.");
    refreshDiag(); return;
  }
  setStatus("requesting camera…"); hideCambar();
  const SETS=[
    {video:{facingMode:S.facing,width:{ideal:1280},height:{ideal:720}},audio:false},
    {video:true,audio:false},
  ];
  for(let i=0;i<SETS.length;i++){
    try{
      const stream=await withTimeout(navigator.mediaDevices.getUserMedia(SETS[i]),15000);
      if(gen!==camGen){stream.getTracks().forEach(t=>t.stop());return;}
      video.loop=false; video.srcObject=stream; await video.play();
      camW=video.videoWidth||1280; camH=video.videoHeight||720;
      mode="live"; setStatus("live camera"); hideCambar(); nudge("Camera live — effects running");
      clearTrails(); refreshDiag(); return;
    }catch(e){
      if(gen!==camGen)return;
      lastErr=e;
      if(e&&(e.message==="timeout"||e.name==="NotAllowedError"))break;
    }
  }
  if(gen!==camGen)return;
  mode="pattern";
  const why=describeErr(lastErr);
  setStatus("unavailable ("+why+")");
  showCambar("Camera didn't come through ("+why+"). Tap Enable camera to retry, or Take photo / Record clip below — they use your phone's own camera app.");
  refreshDiag();
}
$("camRetry").onclick=async()=>{hideCambar();await initCamera();};
$("retryCam").onclick=async()=>{await initCamera();};
$("flip").onclick=async()=>{S.facing=S.facing==="environment"?"user":"environment";await initCamera();};

const photoCan=document.createElement("canvas");
$("btnPhoto").onclick=()=>$("capPhoto").click();
$("btnClip").onclick=()=>$("capClip").click();
$("capPhoto").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f)return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{
    photoCan.width=img.naturalWidth||512; photoCan.height=img.naturalHeight||512;
    photoCan.getContext("2d").drawImage(img,0,0);
    URL.revokeObjectURL(url);
    stopLive(); mode="photo"; camW=photoCan.width; camH=photoCan.height;
    setStatus("photo — FX live on still"); hideCambar(); clearTrails(); nudge("Photo loaded — dial in the FX");
  };
  img.onerror=()=>{URL.revokeObjectURL(url);nudge("Couldn't read that photo");};
  img.src=url;
});
$("capClip").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f)return;
  stopLive(); video.loop=true; video.srcObject=null;
  video.src=URL.createObjectURL(f);
  video.play().then(()=>{
    mode="clip"; camW=video.videoWidth||1280; camH=video.videoHeight||720;
    setStatus("clip — FX on playback"); hideCambar(); clearTrails(); nudge("Clip loaded — FX running on it");
  }).catch(()=>{setStatus("couldn't play clip");nudge("Couldn't play that clip");});
});

/* ================= render ================= */
function uploadFrame(t){
  bindTex(0,camTex);
  if((mode==="live"||mode==="clip")&&video.readyState>=2){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }else if(mode==="photo"&&photoCan.width>0){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,photoCan);
    camW=photoCan.width; camH=photoCan.height;
  }else{
    drawPattern(t*1000); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,pat);
    camW=pat.width; camH=pat.height;
  }
}
function drawFx(t){
  useQuad(fxP);
  bindTex(0,camTex);
  const U=fxP.U,F=S.fx;
  const on=id=>F[id].on?F[id].amt:0;
  gl.uniform1i(U.uTex,0);
  gl.uniform2f(U.uRes,canvas.width,canvas.height);
  const ca=camW/camH,sa=canvas.width/canvas.height;
  let cx=1,cy=1; if(sa>ca){cx=ca/sa;}else{cy=sa/ca;}
  gl.uniform2f(U.uCover,cx,cy);
  gl.uniform2f(U.uTexel,1/camW,1/camH);
  gl.uniform1f(U.uTime,t);
  gl.uniform1f(U.uKSeg,on("kaleido"));
  gl.uniform1f(U.uMirror,F.mirror.on?S.mirrorMode:0);
  gl.uniform1f(U.uSwirl,on("swirl"));
  gl.uniform1f(U.uBulge,on("bulge"));
  gl.uniform1f(U.uWave,on("wave"));
  gl.uniform1f(U.uPixel,on("pixel"));
  gl.uniform1f(U.uGlitch,on("glitch"));
  gl.uniform1f(U.uVHS,on("vhs"));
  gl.uniform1f(U.uRGB,on("rgb"));
  gl.uniform1f(U.uHue,on("hue"));
  gl.uniform1f(U.uPoster,on("poster"));
  gl.uniform1f(U.uDuo,on("duo"));
  gl.uniform1f(U.uInvert,on("invert"));
  gl.uniform1f(U.uEdge,on("edge"));
  gl.uniform1f(U.uScan,on("scan"));
  gl.uniform1f(U.uGrain,on("grain"));
  gl.uniform1f(U.uVig,on("vig"));
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function renderFrame(t){
  uploadFrame(t);
  const W=canvas.width,H=canvas.height;
  gl.viewport(0,0,W,H);
  if(S.fx.trails.on){
    gl.bindFramebuffer(gl.FRAMEBUFFER,fxFBO.fb);
    drawFx(t);
    const tgt=usePing?ping:pong;
    gl.bindFramebuffer(gl.FRAMEBUFFER,tgt.fb);
    useQuad(compP);
    bindTex(0,fxFBO.tex); bindTex(1,prevTex);
    gl.uniform1i(compP.U.uCur,0); gl.uniform1i(compP.U.uPrev,1);
    gl.uniform1f(compP.U.uTAmt,S.fx.trails.amt);
    gl.uniform1f(compP.U.uTZoom,0.012);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    useQuad(blitP);
    bindTex(0,tgt.tex);
    gl.uniform1i(blitP.U.uT,0);
    gl.drawArrays(gl.TRIANGLES,0,3);
    prevTex=tgt.tex; usePing=!usePing;
  }else{
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    drawFx(t);
  }
}
let simT=0,lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,lastTs?(ts-lastTs)/1000:0.016); lastTs=ts;
  simT+=dt*S.motion;
  renderFrame(simT);
}

/* ================= UI ================= */
(function buildGroups(){
  const wrap=$("fxGroups");
  GROUPS.forEach(g=>{
    const row=document.createElement("div");row.className="row";
    const lab=document.createElement("label");lab.textContent=g;
    const fx=document.createElement("div");fx.className="fx";
    FXDEF.filter(d=>d[0]===g).forEach(d=>{
      const b=document.createElement("button");
      b.id="t_"+d[1];b.textContent=d[2];
      b.setAttribute("aria-pressed",d[3]?"true":"false");
      b.onclick=()=>toggleFx(d[1]);
      fx.appendChild(b);
    });
    row.appendChild(lab);row.appendChild(fx);wrap.appendChild(row);
  });
})();
function toggleFx(id){
  const f=S.fx[id];f.on=!f.on;
  $("t_"+id).setAttribute("aria-pressed",f.on?"true":"false");
  if(id==="mirror")$("rowMirror").style.display=f.on?"flex":"none";
  if(id==="trails"&&f.on)clearTrails();
  buildSliders();
}
function buildSliders(){
  const w=$("sliders");w.innerHTML="";
  FXDEF.forEach(d=>{
    const f=S.fx[d[1]];
    if(!f.on||!d[4])return;
    const sl=d[4],fmt=sl[5];
    const row=document.createElement("div");row.className="row";
    const lab=document.createElement("label");lab.textContent=sl[0];
    const inp=document.createElement("input");
    inp.type="range";inp.min=sl[1];inp.max=sl[2];inp.step=sl[3];inp.value=f.amt;
    const vv=document.createElement("span");vv.className="val";vv.textContent=fmt(f.amt);
    inp.oninput=()=>{f.amt=+inp.value;vv.textContent=fmt(f.amt);};
    row.appendChild(lab);row.appendChild(inp);row.appendChild(vv);
    w.appendChild(row);
  });
}
document.querySelectorAll(".mbtn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".mbtn").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    S.mirrorMode=+b.dataset.m;
  };
});
$("sMotion").oninput=e=>{S.motion=+e.target.value;$("vMotion").textContent=S.motion.toFixed(2);};
$("grab").onclick=()=>$("panel").classList.toggle("hidden");
$("qSel").onchange=e=>{S.quality=+e.target.value;resize();nudge("Capture quality: "+S.quality+"p");};
$("bSel").onchange=e=>{S.bitrate=+e.target.value;};
function resize(){
  const w=S.quality===1080?1920:1280;
  canvas.width=w;canvas.height=Math.floor(w*9/16);
  buildFBOs();
}

/* snapshot + recording */
$("snap").onclick=()=>{
  renderFrame(simT);
  canvas.toBlob(b=>{if(!b){nudge("Snapshot failed");return;}
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="prism-cam-"+S.quality+"p.png";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);});
  nudge("Snapshot saved ("+S.quality+"p)");
};
let recorder=null,chunks=[],recTimer=null,recStart=0;
$("rec").onclick=e=>{
  const btn=e.target;
  if(recorder){recorder.stop();return;}
  if(!window.MediaRecorder){nudge("Recording not supported in this browser");return;}
  const stream=canvas.captureStream(30);
  const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"]
    .find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){nudge("Recording not supported in this browser");return;}
  chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:S.bitrate});
  recorder.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data);};
  recorder.onstop=()=>{
    clearInterval(recTimer);$("recTime").textContent="";
    const blob=new Blob(chunks,{type:mime});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="prism-cam-"+S.quality+"p.webm";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    recorder=null;btn.classList.remove("on");btn.textContent="Record";
    nudge("Clip saved ("+S.quality+"p)");
  };
  recorder.start();
  recStart=Date.now();
  recTimer=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);
    $("recTime").textContent="● "+s+"s";},500);
  btn.classList.add("on");btn.textContent="Stop";
};

/* ================= boot ================= */
resize();
buildSliders();
addEventListener("resize",()=>{/* css handles display size; backing fixed by quality */});
initCamera();
requestAnimationFrame(loop);
</script>
</body>
</html>
