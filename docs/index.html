<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prism Cam — Live Camera FX</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif; color:#eee; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #panel { position:fixed; left:0; right:0; bottom:0; max-height:62%; overflow-y:auto;
    background:rgba(8,8,10,.93); backdrop-filter:blur(10px);
    border-top:1px solid #2a2a2e; padding:10px 14px 18px; z-index:10;
    transition:transform .25s ease; }
  #panel.hidden { transform:translateY(calc(100% - 34px)); }
  #grab { height:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #grab::before { content:""; width:44px; height:4px; border-radius:2px; background:#444; }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .row label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#999; min-width:58px; }
  select,button { background:#1b1b1f; color:#eee; border:1px solid #333; border-radius:8px;
    font-size:13px; padding:8px 10px; }
  button { cursor:pointer; }
  button:active { background:#2a2a30; }
  button.primary { background:#e8e4da; color:#111; border-color:#e8e4da; font-weight:600; }
  button.rec { background:#c22; border-color:#c22; color:#fff; font-weight:600; }
  button.rec.on { background:#f44; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  button[aria-pressed="true"] { border-color:#e8e4da; color:#fff; background:#2c2c33; }
  input[type=range] { flex:1; min-width:80px; accent-color:#e8e4da; }
  .val { font-family:monospace; font-size:12px; color:#bbb; width:44px; text-align:right; }
  .fx { display:flex; gap:6px; flex-wrap:wrap; }
  .fx button { font-size:12px; padding:6px 9px; }
  #hint { font-size:11px; color:#777; margin-top:6px; line-height:1.5; }
  .filein { position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0; }
  #camStatus { font-size:12px; color:#bbb; }
  #nudge { position:fixed; top:14px; left:0; right:0; text-align:center; z-index:20;
    pointer-events:none; font-size:13px; color:#fff; text-shadow:0 1px 6px #000;
    background:rgba(0,0,0,.45); margin:0 auto; width:max-content; max-width:92vw;
    padding:8px 16px; border-radius:20px; display:none; }
  #cambar { position:fixed; top:58px; left:0; right:0; z-index:21;
    margin:0 auto; width:max-content; max-width:92vw;
    background:rgba(10,10,12,.94); border:1px solid #3a3a40; border-radius:14px;
    padding:12px 16px; display:none; text-align:center; }
  #cambar p { margin:0 0 10px; font-size:13px; line-height:1.5; color:#ddd; max-width:70vw; }
  #cambar .row { margin:0; justify-content:center; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="nudge"></div>
<div id="cambar"><p id="cambarMsg"></p><div class="row"><button id="camRetry" class="primary">Enable camera</button></div></div>

<div id="panel">
  <div id="grab"></div>

  <div class="row">
    <label>FX</label>
    <div class="fx">
      <button id="tKaleido" aria-pressed="true">Kaleido</button>
      <button id="tMirror" aria-pressed="false">Mirror</button>
      <button id="tGlitch" aria-pressed="true">Glitch</button>
      <button id="tRGB" aria-pressed="true">RGB split</button>
      <button id="tSwirl" aria-pressed="false">Swirl</button>
      <button id="tScan" aria-pressed="false">Scanlines</button>
    </div>
  </div>

  <div class="row" id="rowKaleido">
    <label>Segments</label>
    <input type="range" id="sKaleido" min="2" max="12" step="1" value="6">
    <span class="val" id="vKaleido">6</span>
  </div>
  <div class="row" id="rowMirror" style="display:none">
    <label>Mode</label>
    <div class="fx">
      <button data-m="1" class="mbtn" aria-pressed="true">Left/Right</button>
      <button data-m="2" class="mbtn" aria-pressed="false">Top/Bottom</button>
      <button data-m="3" class="mbtn" aria-pressed="false">Quad</button>
    </div>
  </div>
  <div class="row" id="rowGlitch">
    <label>Glitch</label>
    <input type="range" id="sGlitch" min="0" max="0.25" step="0.005" value="0.08">
    <span class="val" id="vGlitch">0.08</span>
  </div>
  <div class="row" id="rowRGB">
    <label>RGB split</label>
    <input type="range" id="sRGB" min="0" max="0.06" step="0.002" value="0.012">
    <span class="val" id="vRGB">0.012</span>
  </div>
  <div class="row" id="rowSwirl" style="display:none">
    <label>Swirl</label>
    <input type="range" id="sSwirl" min="0" max="8" step="0.1" value="3">
    <span class="val" id="vSwirl">3.0</span>
  </div>
  <div class="row" id="rowScan" style="display:none">
    <label>Scan</label>
    <input type="range" id="sScan" min="0" max="1" step="0.05" value="0.5">
    <span class="val" id="vScan">0.50</span>
  </div>

  <div class="row">
    <button id="flip">Flip camera</button>
    <button id="snap">Snapshot</button>
    <button id="rec" class="rec">Record</button>
  </div>

  <div class="row">
    <label>Source</label>
    <span id="camStatus">starting…</span>
  </div>
  <div class="row">
    <button id="retryCam">Retry camera</button>
    <button id="btnPhoto">Take photo</button>
    <button id="btnClip">Record clip</button>
    <input type="file" id="capPhoto" accept="image/*" capture="environment" class="filein">
    <input type="file" id="capClip" accept="video/*" capture="environment" class="filein">
  </div>
  <details id="diag" style="font-size:11px;color:#888">
    <summary style="cursor:pointer;color:#999;font-size:11px">Diagnostics (tap if camera still fails)</summary>
    <div id="diagBody" style="margin-top:4px;line-height:1.6">—</div>
  </details>

  <div id="hint">Allow the camera for live FX. If this viewer won't grant it, Take photo / Record clip open your phone's own camera app and the FX run on what you capture. Record saves a .webm, Snapshot saves a PNG.</div>
</div>

<script>
"use strict";
/* ================= state ================= */
const S = {
  kaleido:true, seg:6,
  mirror:false, mirrorMode:1,
  glitch:true, glitchAmt:0.08,
  rgb:true, rgbAmt:0.012,
  swirl:false, swirlAmt:3.0,
  scan:false, scanAmt:0.5,
  facing:"environment",
};
const $=id=>document.getElementById(id);
const nudgeEl=$("nudge");
function nudge(msg,ms=2600){nudgeEl.textContent=msg;nudgeEl.style.display="block";
  clearTimeout(nudgeEl._t);nudgeEl._t=setTimeout(()=>nudgeEl.style.display="none",ms);}

/* ================= WebGL ================= */
const canvas=$("view");
const gl=canvas.getContext("webgl2",{preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML="<div style='padding:40px;text-align:center'>WebGL2 is required.</div>";throw 0;}

const VS=`#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.,1.);}`;

const FS=`#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes, uCover;
uniform float uTime,uSwirl,uSeg,uGlitch,uRGB,uScan;
uniform int uMirror;
in vec2 vUv; out vec4 frag;
float hash(float n){return fract(sin(n*127.1)*43758.5453);}
vec2 kaleido(vec2 uv,float seg){
  vec2 c=uv-0.5; float r=length(c); float a=atan(c.y,c.x);
  float slice=6.2831853/seg; a=mod(a,slice); a=abs(a-slice*0.5);
  return vec2(cos(a),sin(a))*r+0.5;
}
void main(){
  vec2 uv=(vUv-0.5)*uCover+0.5;
  if(uSwirl>0.001){
    vec2 c=uv-0.5; float r=length(c);
    float ang=uSwirl*exp(-r*r*7.0);
    float s=sin(ang),co=cos(ang);
    uv=vec2(co*c.x-s*c.y,s*c.x+co*c.y)+0.5;
  }
  if(uSeg>0.5) uv=kaleido(uv,uSeg);
  if(uMirror==1) uv.x=abs(uv.x-0.5);
  else if(uMirror==2) uv.y=abs(uv.y-0.5);
  else if(uMirror==3){uv.x=abs(uv.x-0.5);uv.y=abs(uv.y-0.5);}
  if(uGlitch>0.001){
    float row=floor(uv.y*70.0);
    float t=floor(uTime*9.0);
    float band=step(0.72,hash(row*0.37+t*3.1));
    float shift=(hash(row+t*17.0)-0.5)*uGlitch*band;
    uv.x+=shift;
    float tear=step(0.93,hash(row*1.7+t*7.7))*uGlitch*2.0;
    uv.x+=tear*(hash(t)-0.5);
  }
  vec2 roff=(uv-0.5)*uRGB;
  vec3 col=vec3(texture(uTex,uv+roff).r,texture(uTex,uv).g,texture(uTex,uv-roff).b);
  if(uScan>0.001){
    col*=1.0-uScan*0.18*(0.5+0.5*sin(vUv.y*uRes.y*3.14159));
    vec2 vc=vUv-0.5; col*=1.0-uScan*0.35*dot(vc,vc);
  }
  frag=vec4(col,1.0);
}`;

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);gl.useProgram(prog);
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const aPos=gl.getAttribLocation(prog,"aPos");
gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
const U={};["uTex","uRes","uCover","uTime","uSwirl","uSeg","uGlitch","uRGB","uScan","uMirror"]
  .forEach(n=>U[n]=gl.getUniformLocation(prog,n));

const tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.uniform1i(U.uTex,0);

/* ================= camera / fallback source ================= */
const video=document.createElement("video");
video.playsInline=true; video.muted=true; video.loop=true;
let camW=1280, camH=720;
let mode="pattern"; // live | clip | photo | pattern
let camGen=0, lastErr=null;

// animated test pattern when the camera is unavailable
const pat=document.createElement("canvas"); pat.width=512; pat.height=288;
const pctx=pat.getContext("2d");
function drawPattern(t){
  const w=pat.width,h=pat.height;
  const g=pctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,"#0b3b8f"); g.addColorStop(.5,"#7a1e5e"); g.addColorStop(1,"#0e7a5c");
  pctx.fillStyle=g; pctx.fillRect(0,0,w,h);
  for(let i=0;i<7;i++){
    const x=w*(0.5+0.42*Math.sin(t*0.0004*(i+1)+i*2.1));
    const y=h*(0.5+0.42*Math.cos(t*0.0005*(i+2)+i*1.3));
    const r=26+22*Math.sin(t*0.001+i);
    const rg=pctx.createRadialGradient(x,y,2,x,y,Math.abs(r)+4);
    const hue=(t*0.02+i*52)%360;
    rg.addColorStop(0,`hsla(${hue},90%,65%,.95)`); rg.addColorStop(1,"hsla(0,0%,0%,0)");
    pctx.fillStyle=rg; pctx.beginPath(); pctx.arc(x,y,Math.abs(r)+4,0,7); pctx.fill();
  }
  pctx.fillStyle="rgba(255,255,255,.9)"; pctx.font="bold 22px sans-serif";
  pctx.fillText("PRISM CAM — test pattern",18,34);
}

const cambar=$("cambar"), cambarMsg=$("cambarMsg");
function showCambar(msg){cambarMsg.textContent=msg;cambar.style.display="block";}
function hideCambar(){cambar.style.display="none";}
function setStatus(s){const el=$("camStatus");if(el)el.textContent="Source: "+s;}
async function refreshDiag(){
  const el=$("diagBody"); if(!el)return;
  const lines=[];
  lines.push("secure context: "+window.isSecureContext);
  const hasMD=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  lines.push("camera API present: "+hasMD);
  if(hasMD){
    try{
      const devs=await navigator.mediaDevices.enumerateDevices();
      lines.push("video inputs seen: "+devs.filter(d=>d.kind==="videoinput").length);
    }catch(e){lines.push("enumerateDevices: "+(e.name||e.message||e));}
  }
  lines.push("last error: "+(lastErr?(lastErr.name+": "+(lastErr.message||"(no message)")):"none"));
  lines.push("mode: "+mode);
  el.innerHTML=lines.map(l=>String(l).replace(/</g,"&lt;")).join("<br>");
}

function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);}
function describeErr(e){
  if(!e)return "unknown";
  if(e.message==="timeout")return "the permission popup never answered";
  const n=e.name||"";
  if(n==="NotAllowedError")return "permission denied";
  if(n==="NotFoundError"||n==="OverconstrainedError")return "no matching camera";
  if(n==="SecurityError")return "blocked by this viewer";
  return n||"error";
}
function stopLive(){
  if(video.srcObject){try{video.srcObject.getTracks().forEach(t=>t.stop());}catch(e){}video.srcObject=null;}
  try{video.pause();}catch(e){}
}

async function initCamera(){
  const gen=++camGen;
  stopLive();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    mode="pattern"; setStatus("unavailable (no camera API in this viewer)");
    showCambar("This viewer can't reach your camera at all. Use Take photo or Record clip below — they open your phone's own camera app.");
    refreshDiag(); return;
  }
  setStatus("requesting camera…"); hideCambar();
  const SETS=[
    {video:{facingMode:S.facing,width:{ideal:1280},height:{ideal:720}},audio:false},
    {video:true,audio:false},
  ];
  for(let i=0;i<SETS.length;i++){
    try{
      const stream=await withTimeout(navigator.mediaDevices.getUserMedia(SETS[i]),15000);
      if(gen!==camGen){stream.getTracks().forEach(t=>t.stop());return;}
      video.loop=false; video.srcObject=stream; await video.play();
      camW=video.videoWidth||1280; camH=video.videoHeight||720;
      mode="live"; setStatus("live camera"); hideCambar(); nudge("Camera live — effects running");
      refreshDiag(); return;
    }catch(e){
      if(gen!==camGen)return;
      lastErr=e;
      if(e&&(e.message==="timeout"||e.name==="NotAllowedError"))break; // don't stack prompts on denial
    }
  }
  if(gen!==camGen)return;
  mode="pattern";
  const why=describeErr(lastErr);
  setStatus("unavailable ("+why+")");
  let msg;
  if(lastErr&&lastErr.name==="NotAllowedError"){
    msg="Camera permission was denied ("+why+"). If the popup flickers and won't grant it, the Muse app itself is missing camera access — fix it once: Android Settings → Apps → Muse → Permissions → Camera → Allow. Then tap Enable camera.";
  }else{
    msg="Camera didn't come through ("+why+"). Tap Enable camera to retry, or Take photo / Record clip below — they use your phone's own camera app, no viewer permission needed.";
  }
  showCambar(msg);
  refreshDiag();
}
$("camRetry").onclick=async()=>{hideCambar();await initCamera();};
$("retryCam").onclick=async()=>{await initCamera();};
$("flip").onclick=async()=>{S.facing=S.facing==="environment"?"user":"environment";await initCamera();};

/* native capture — file input with capture opens the phone's camera app directly,
   works in any viewer without WebView camera permission */
const photoCan=document.createElement("canvas");
$("btnPhoto").onclick=()=>$("capPhoto").click();
$("btnClip").onclick=()=>$("capClip").click();
$("capPhoto").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f)return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{
    photoCan.width=img.naturalWidth||512; photoCan.height=img.naturalHeight||512;
    photoCan.getContext("2d").drawImage(img,0,0);
    URL.revokeObjectURL(url);
    stopLive(); mode="photo"; camW=photoCan.width; camH=photoCan.height;
    setStatus("photo — FX live on still"); hideCambar(); nudge("Photo loaded — dial in the FX");
  };
  img.onerror=()=>{URL.revokeObjectURL(url);nudge("Couldn't read that photo");};
  img.src=url;
});
$("capClip").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f)return;
  stopLive(); video.loop=true; video.srcObject=null;
  video.src=URL.createObjectURL(f);
  video.play().then(()=>{
    mode="clip"; camW=video.videoWidth||1280; camH=video.videoHeight||720;
    setStatus("clip — FX on playback"); hideCambar(); nudge("Clip loaded — FX running on it");
  }).catch(()=>{setStatus("couldn't play clip");nudge("Couldn't play that clip");});
});

function resize(){const dpr=Math.min(2,devicePixelRatio||1);
  canvas.width=Math.floor(innerWidth*dpr); canvas.height=Math.floor(innerHeight*dpr);}
addEventListener("resize",resize); resize();

function uploadFrame(t){
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);
  if((mode==="live"||mode==="clip")&&video.readyState>=2){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }else if(mode==="photo"&&photoCan.width>0){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,photoCan);
    camW=photoCan.width; camH=photoCan.height;
  }else{
    drawPattern(t); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,pat);
    camW=pat.width; camH=pat.height;
  }
}

function draw(t){
  uploadFrame(t);
  const cw=canvas.width,ch=canvas.height;
  const ca=camW/camH, sa=cw/ch;
  let cx=1,cy=1;
  if(sa>ca){cx=ca/sa;}else{cy=sa/ca;}
  gl.viewport(0,0,cw,ch);
  gl.uniform2f(U.uRes,cw,ch);
  gl.uniform2f(U.uCover,cx,cy);
  gl.uniform1f(U.uTime,t/1000);
  gl.uniform1f(U.uSwirl,S.swirl?S.swirlAmt:0);
  gl.uniform1f(U.uSeg,S.kaleido?S.seg:0);
  gl.uniform1f(U.uGlitch,S.glitch?S.glitchAmt:0);
  gl.uniform1f(U.uRGB,S.rgb?S.rgbAmt:0);
  gl.uniform1f(U.uScan,S.scan?S.scanAmt:0);
  gl.uniform1i(U.uMirror,S.mirror?S.mirrorMode:0);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
(function loop(t){requestAnimationFrame(loop);draw(t||0);})();

/* ================= UI wiring ================= */
function toggle(btn,key,rowId){
  $(btn).onclick=e=>{
    S[key]=!S[key];
    e.target.setAttribute("aria-pressed",S[key]);
    if(rowId)$(rowId).style.display=S[key]?"flex":"none";
  };
}
toggle("tKaleido","kaleido","rowKaleido");
toggle("tMirror","mirror","rowMirror");
toggle("tGlitch","glitch","rowGlitch");
toggle("tRGB","rgb","rowRGB");
toggle("tSwirl","swirl","rowSwirl");
toggle("tScan","scan","rowScan");

function slider(id,vid,key,fmt){
  $(id).oninput=e=>{S[key]=+e.target.value;$(vid).textContent=fmt(S[key]);};
}
slider("sKaleido","vKaleido","seg",v=>v);
slider("sGlitch","vGlitch","glitchAmt",v=>v.toFixed(3));
slider("sRGB","vRGB","rgbAmt",v=>v.toFixed(3));
slider("sSwirl","vSwirl","swirlAmt",v=>v.toFixed(1));
slider("sScan","vScan","scanAmt",v=>v.toFixed(2));

document.querySelectorAll(".mbtn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".mbtn").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    S.mirrorMode=+b.dataset.m;
  };
});
$("grab").onclick=()=>$("panel").classList.toggle("hidden");

/* snapshot + recording */
$("snap").onclick=()=>{
  draw(performance.now());
  canvas.toBlob(b=>{const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="prism-cam.png";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);});
  nudge("Snapshot saved");
};
let recorder=null,chunks=[];
$("rec").onclick=e=>{
  if(recorder){
    recorder.stop(); e.target.classList.remove("on"); e.target.textContent="Record";
    return;
  }
  const stream=canvas.captureStream(30);
  const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"]
    .find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mime){nudge("Recording not supported in this browser");return;}
  chunks=[]; recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6});
  recorder.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data);};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="prism-cam.webm";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    recorder=null; nudge("Clip saved");
  };
  recorder.start(); e.target.classList.add("on"); e.target.textContent="Stop";
};

initCamera();
</script>
</body>
</html>
